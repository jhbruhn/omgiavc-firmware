name: Publish Firmware

on:
  workflow_call:
    inputs:
      version:
        description: Release tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to build (e.g. v1.2.3)
        required: true

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build Firmware
    uses: esphome/workflows/.github/workflows/build.yml@2026.4.1
    with:
      #### Modify below here to match your project ####
      files: |
        omgiavc.factory.yaml
      esphome-version: 2026.4.1
      #### Modify above here to match your project ####

      release-url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version }}
      release-version: ${{ inputs.version }}

  upload-to-release:
    name: Upload to Release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@2026.4.1
    needs:
      - build-firmware
    with:
      version: ${{ inputs.version }}
