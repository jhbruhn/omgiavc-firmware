substitutions:
  encoder_steps_per_rotation: "20"   # hardware: steps for a full 360° turn
  fan_speed_count: "100"             # fan API resolution (independent of encoder)
  fan_min_power: "0.1"               # minimum PWM duty cycle that spins the motor
  led_brightness: "0.5"         
  led_r: "255"
  led_g: "255"
  led_b: "255"

esphome:
  name: omgiavc
  friendly_name: OMGIAVC
  name_add_mac_suffix: true
  project:
    name: jhbruhn.OMGIAVC
    version: dev
  includes:
    - natural_wind.h
  on_boot:
    priority: -100
    then:
      # Restore may not call turn_on_action on the switch, so sync here.
      - lambda: |-
          if (id(natural_mode)->state && id(motor)->state && !natural_wind.is_active())
            natural_wind.activate();
      - script.execute: set_led_state

esp32:
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  power_save_mode: NONE
  ap:

captive_portal:

web_server:
  port: 80
  version: 3

globals:
  - id: improv_state
    type: int
    restore_value: false
    initial_value: "0"  # 0=idle, 1=awaiting authorization, 2=provisioning

output:
  - platform: ledc
    id: fan_pwm
    pin: GPIO10
    frequency: 25000Hz
    min_power: ${fan_min_power}

switch:
  - platform: template
    id: natural_mode
    name: "Natural Wind"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          if (id(motor)->state)
            natural_wind.activate();
      - script.execute: set_led_state
    turn_off_action:
      - lambda: |-
          natural_wind.deactivate();
          if (id(motor)->state)
            id(fan_pwm)->set_level((float)id(motor)->speed / (float)${fan_speed_count});
      - script.execute: set_led_state

fan:
  - platform: template
    id: motor
    name: None
    speed_count: ${fan_speed_count}
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if (id(natural_mode)->state) {
            natural_wind.activate();
          } else {
            id(fan_pwm)->set_level((float)id(motor)->speed / (float)${fan_speed_count});
          }
      - script.execute: set_led_state
    on_turn_off:
      - lambda: |-
          id(fan_pwm)->set_level(0.0f);
          natural_wind.deactivate();
      - script.execute: set_led_state
    on_speed_set:
      - lambda: |-
          if (id(motor)->state && !id(natural_mode)->state)
            id(fan_pwm)->set_level((float)x / (float)${fan_speed_count});

light:
  - platform: esp32_rmt_led_strip
    id: ring
    internal: true
    rgb_order: GRB
    chipset: SK6812
    pin: GPIO21
    num_leds: 11
    effects:
      - pulse:
          name: "Improv Awaiting"
          transition_length: 1s
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          name: "Improv Provisioning"
          transition_length: 250ms
          min_brightness: 0%
          max_brightness: 100%
      - addressable_lambda:
          name: "Fan Meter"
          update_interval: 50ms
          lambda: |-
            auto *f = id(motor);
            float pct = f->state ? (f->speed / (float)${fan_speed_count}) : 0.0f;
            float pos = pct * it.size();
            int lit = (int)pos;
            float frac = pos - lit;
            for (int i = 0; i < it.size(); i++) {
              if (i < lit) {
                it[i] = Color(${led_r}, ${led_g}, ${led_b});
              } else if (i == lit) {
                it[i] = Color((uint8_t)(${led_r} * frac), (uint8_t)(${led_g} * frac), (uint8_t)(${led_b} * frac));
              } else {
                it[i] = Color(0, 0, 0);
              }
            }
      - addressable_lambda:
          name: "Natural Wind"
          update_interval: 16ms
          lambda: |-
            auto *f = id(motor);
            float pct = f->state ? (f->speed / (float)${fan_speed_count}) : 0.0f;
            float pos = pct * it.size();
            int lit = (int)pos;
            float frac = pos - lit;
            float pulse = 0.7f + 0.3f * sinf((float)millis() / 600.0f);
            for (int i = 0; i < it.size(); i++) {
              if (i < lit)       it[i] = Color(0, (uint8_t)(255.0f * pulse), 0);
              else if (i == lit) it[i] = Color(0, (uint8_t)(255.0f * pulse * frac), 0);
              else               it[i] = Color(0, 0, 0);
            }

improv_serial:

esp32_improv:
  authorizer: encoder_button
  on_start:
    then:
      - lambda: id(improv_state) = 1;
      - script.execute: set_led_state
  on_provisioning:
    then:
      - lambda: id(improv_state) = 2;
      - script.execute: set_led_state
  on_provisioned:
    then:
      - lambda: id(improv_state) = 0;
      - script.execute: set_led_state

interval:
  - interval: 300ms
    then:
      - if:
          condition:
            lambda: "return natural_wind.is_active() && id(motor)->state;"
          then:
            - lambda: |-
                int min_sp = (int)roundf((float)${fan_speed_count} * ${fan_min_power});
                id(fan_pwm)->set_level(natural_wind.tick(id(motor)->speed, min_sp, ${fan_speed_count}));

script:
  - id: adjust_fan_speed
    parameters:
      direction: int
    then:
      - lambda: |-
          int step = (int)roundf(${fan_speed_count} * 360.0f / (270.0f * ${encoder_steps_per_rotation}));
          int min_speed = (int)roundf(${fan_speed_count} * ${fan_min_power});
          if (!id(motor).state) {
            if (direction > 0) {
              auto call = id(motor).turn_on();
              call.set_speed(min_speed);
              call.perform();
            }
            return;
          }
          int new_speed = std::max(id(motor).speed + direction * step, min_speed);
          new_speed = std::min(new_speed, ${fan_speed_count});
          auto call = id(motor).turn_on();
          call.set_speed(new_speed);
          call.perform();

  - id: set_led_state
    then:
      - lambda: |-
          auto call = id(ring)->turn_on();
          call.set_brightness(${led_brightness});
          if (id(improv_state) == 1) {
            call.set_red(0.0f); call.set_green(0.0f); call.set_blue(1.0f);
            call.set_effect("Improv Awaiting");
          } else if (id(improv_state) == 2) {
            call.set_red(0.0f); call.set_green(0.0f); call.set_blue(1.0f);
            call.set_effect("Improv Provisioning");
          } else if (natural_wind.is_active() && id(motor)->state) {
            call.set_effect("Natural Wind");
          } else {
            call.set_effect("Fan Meter");
          }
          call.perform();

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      inverted: true
    id: encoder_button
    internal: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_click:
      - min_length: 50ms
        max_length: 700ms
        then:
          - fan.toggle: motor
      - min_length: 800ms
        max_length: 5000ms
        then:
          - switch.toggle: natural_mode

sensor:
  - platform: pulse_counter
    pin: GPIO18
    name: "Motor Speed"
    entity_category: diagnostic
    unit_of_measurement: "RPM"
    update_interval: 5s
    filters:
      - multiply: 0.2

  - platform: rotary_encoder
    id: encoder
    pin_a:
      number: GPIO23
    pin_b:
      number: GPIO22
    restore_mode: RESTORE_DEFAULT_ZERO
    on_clockwise:
      then:
        - script.execute:
            id: adjust_fan_speed
            direction: 1
    on_anticlockwise:
      then:
        - script.execute:
            id: adjust_fan_speed
            direction: -1
